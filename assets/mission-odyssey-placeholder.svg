<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic dream road placeholder</title>
  <desc id="desc">Abstract neon sunrise over a distant city with a glowing path in the foreground.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="15%" r="80%">
      <stop offset="0%" stop-color="#f9d6a8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#c76a8b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#140a24" />
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4c36e" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#c75f3c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10061a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8f0d8" stop-opacity="0" />
      <stop offset="50%" stop-color="#f4d89c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f8f0d8" stop-opacity="0" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)" />
  <g opacity="0.7">
    <path d="M0 820 Q960 520 1920 820 V1080 H0 Z" fill="#1a0f29" />
    <path d="M0 860 Q960 560 1920 860" fill="none" stroke="#f7dfbd" stroke-opacity="0.12" stroke-width="6" />
    <path d="M0 900 Q960 600 1920 900" fill="none" stroke="#f7dfbd" stroke-opacity="0.08" stroke-width="6" />
  </g>
  <g filter="url(#grain)" opacity="0.2">
    <rect width="1920" height="1080" fill="#f8e6ce" />
  </g>
  <g opacity="0.85">
    <path d="M880 1080 Q960 720 1040 1080" fill="url(#road)" />
    <path d="M910 1080 Q960 760 1010 1080" fill="url(#road)" opacity="0.8" />
    <path d="M940 1080 Q960 820 980 1080" fill="url(#road)" opacity="0.65" />
    <path d="M860 1080 Q960 680 1060 1080" fill="none" stroke="#f7dfbd" stroke-width="6" stroke-opacity="0.4" />
  </g>
  <g opacity="0.7">
    <circle cx="960" cy="260" r="220" fill="url(#glow)" />
    <circle cx="960" cy="260" r="160" fill="#f5dcb0" fill-opacity="0.16" />
    <circle cx="960" cy="260" r="6" fill="#fef9ec" />
  </g>
  <g fill="#f5dcb0" fill-opacity="0.4">
    <rect x="600" y="360" width="12" height="62" rx="6" />
    <rect x="680" y="300" width="14" height="84" rx="7" />
    <rect x="760" y="340" width="10" height="72" rx="5" />
    <rect x="820" y="280" width="12" height="104" rx="6" />
    <rect x="870" y="360" width="16" height="70" rx="8" />
    <rect x="1010" y="340" width="14" height="82" rx="7" />
    <rect x="1080" y="300" width="10" height="94" rx="5" />
    <rect x="1140" y="330" width="12" height="78" rx="6" />
    <rect x="1200" y="360" width="14" height="66" rx="7" />
    <rect x="1260" y="320" width="12" height="88" rx="6" />
  </g>
</svg>
